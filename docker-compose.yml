services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lucas-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lucas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-lucas}
    ports:
      # Solo esta máquina: la base de la demo no se abre a la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - lucas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lucas} -d ${POSTGRES_DB:-lucas}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  lucas-db:

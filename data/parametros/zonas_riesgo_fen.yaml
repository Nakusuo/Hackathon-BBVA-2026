# Exposicion de cada departamento a lluvias por encima de lo normal durante El Nino costero 2026-2027.
# Fuente: Comision ENFEN, comunicados oficiales 17, 18 y 19 de 2026 (texto en docs/fuentes/enfen), consulta 2026-11-14.
version: 1
vigente_hasta: "2027-06-30"
fuente:
  comunicado_19: "Lluvias de noviembre 2026 a enero 2027 por encima de lo normal en la costa norte, sierra occidental, costa central y sierra central occidental, con episodios de moderada a fuerte intensidad. Caudales superiores a lo normal en Tumbes, Chira, Piura, La Leche y Jequetepeque, y desde diciembre hacia la costa central (cuencas de Chillon, Rimac y Lurin). Lluvias de normales a inferiores en la sierra sur oriental, sierra centro oriental y la Amazonia; mas acentuado en Titicaca."
  comunicado_17: "Costa norte, costa central y valles de la vertiente occidental andina norte con precipitaciones superiores a lo normal; episodios de lluvia de moderada a fuerte intensidad principalmente en la costa norte."
niveles:
  alta:
    departamentos: [Tumbes, Piura, Lambayeque, La Libertad]
    estado: parcial
    motivo: "Costa norte y cuencas Tumbes, Chira, Piura, La Leche y Jequetepeque nombradas por el ENFEN. La asignacion de La Libertad por Jequetepeque es inferencia del equipo."
  media:
    departamentos: [Lima, Callao]
    estado: parcial
    motivo: "Costa central y cuencas Chillon, Rimac y Lurin nombradas por el ENFEN desde diciembre."
  posible:
    departamentos: [Cajamarca, Ancash]
    estado: supuesto
    motivo: "Sierra norte occidental y sierra occidental con lluvias sobre lo normal segun el ENFEN; los departamentos exactos son supuesto del equipo."
  baja:
    motivo: "Resto del pais: lluvias de normales a inferiores o sin senal en los comunicados (sierra sur oriental, sierra centro oriental, Amazonia, Titicaca)."
acciones_prevencion:
  - "Revisar el techo y las canaletas de la vivienda y reparar filtraciones antes de las lluvias."
  - "Tener un fondo de emergencia para al menos un mes de gastos."
  - "Guardar documentos importantes en un lugar alto y en copia digital."
  - "Conocer la ruta de evacuacion y el punto de encuentro de la zona."
  - "Asegurar la vivienda y los bienes de valor y revisar si hay un seguro que los cubra."

# Eventos que mueven ingresos y consumo. Un multiplicador de 1 = sin efecto; el efecto pleno se aplica durante el evento
# y se disipa linealmente en "recuperacion_dias". "severidad_region" escala el efecto por region (1 = igual).
# Segmentos de ingreso: formal_quincena, base_comision, independiente_diario, independiente_proyectos, mixto.
# Lo verificado va en "fuente"; las magnitudes por segmento y categoria son supuestos del equipo para estresar los modelos.
version: 1
eventos:
  - id: covid_confinamiento
    nombre: "Confinamiento por covid-19"
    tipo: historico
    inicio: "2020-03-16"
    fin: "2020-06-30"
    recuperacion_dias: 120
    ingreso: {formal_quincena: 0.93, base_comision: 0.70, independiente_diario: 0.40, independiente_proyectos: 0.55, mixto: 0.65}
    prob_corte_total: {formal_quincena: 0.07, base_comision: 0.10, independiente_diario: 0.25, independiente_proyectos: 0.12, mixto: 0.12}
    categorias: {transporte: 0.25, ocio: 0.15, delivery: 1.8, alimentos: 1.1, salud: 1.5, compras: 0.5, restaurantes: 0.2}
    severidad_region: {lima: 1.0, norte: 0.9, sur: 0.7, centro: 0.8, oriente: 0.8}
    estado: parcial
    fuente: "INEI: ocupados de Lima Metropolitana -25 % (feb-abr 2020) y -55,1 % (abr-jun 2020); ingreso promedio de Lima -9,4 % interanual. Magnitudes por segmento: supuesto"


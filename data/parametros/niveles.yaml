# Niveles de Lucas por segmento del cliente y programa de puntos.
# El nombre sale del ranking de salud financiera de cada segmento (no del numero de cluster), asi que no cambia si se reentrena el modelo.
# Los puntos premian ahorro y conductas sanas siempre, y el consumo solo cuando la caja esta ordenada. Catalogo ficticio y generico (sin marcas).
version: 2
escalera: [luchador, aprendiz, constructor, maestro, campeon]   # con k segmentos se eligen k nombres repartidos en la escalera
niveles:
  luchador:
    titulo: "Luchador"
    resumen: "Tu caja se aprieta antes de cobrar. Vamos paso a paso y sin presion."
    tono: "cercano y tranquilo; una sola accion a la vez"
    multiplicador_puntos: 1.5
    beneficios: ["Aviso anticipado cuando se acerca un dia en rojo", "Plan Sueldo Lucas para ordenar un ingreso irregular", "Puntos extra por cada primer logro"]
    para_subir: {salud_minima: 40, dias_rojo_3m_max: 3}
  aprendiz:
    titulo: "Aprendiz"
    resumen: "Estas armando tus habitos. Ya no te ahoga la caja, ahora toca ganar margen."
    tono: "motivador; explica el porque de cada consejo"
    multiplicador_puntos: 1.3
    beneficios: ["Metas de ahorro con aporte por quincena", "Rutas de educacion financiera segun tu perfil", "Puntos extra por cumplir metas"]
    para_subir: {salud_minima: 55, colchon_meses_min: 1.0}
  constructor:
    titulo: "Constructor"
    resumen: "Tienes base. Estas construyendo colchon y orden."
    tono: "practico; propone metas medibles"
    multiplicador_puntos: 1.2
    beneficios: ["Simulador de escenarios", "Comparador educativo de tasas"]
    para_subir: {salud_minima: 65, colchon_meses_min: 2.0}
  maestro:
    titulo: "Maestro"
    resumen: "Manejas bien tu plata. Se trata de afinar y de protegerte de imprevistos."
    tono: "directo; da opciones y deja decidir"
    multiplicador_puntos: 1.1
    beneficios: ["Prioridad en ofertas idoneas de ahorro", "Revision trimestral de tus gastos fijos", "Descuentos del catalogo de canje"]
    para_subir: {salud_minima: 75, ahorro_pct_min: 0.10, colchon_meses_min: 3.0}
  campeon:
    titulo: "Campeon"
    resumen: "Vas adelante: colchon, ahorro y orden. Ahora cuidamos lo que lograste."
    tono: "reconoce el logro; propone proteger y hacer crecer con prudencia"
    multiplicador_puntos: 1.0
    beneficios: ["Acceso prioritario a las mejores condiciones idoneas del catalogo", "Beneficios exclusivos del catalogo de canje", "Invitacion a ser guia de otros usuarios"]
    para_subir: {}

puntos:
  # Puntos base por conducta sana. Se multiplican por el multiplicador del nivel: quien parte de mas lejos gana mas por cada logro.
  acciones:
    quincena_sin_dias_en_rojo: 10
    aporte_a_meta_de_ahorro: 20
    cancelar_suscripcion_duplicada: 10
    modulo_educativo_completado: 5
    colchon_de_un_mes_mantenido: 15
    accion_de_prevencion_ante_el_nino: 30
    subir_de_nivel: 80
  valor_por_punto_soles: 0.01      # supuesto del equipo; el banco pone el suyo
  tope_mensual: 300

# Programa de puntos con economia sostenible. Todos los supuestos economicos son del equipo (no son cifras publicas verificadas).
programa:
  supuestos_economicos:
    comision_por_consumo: 0.010            # lo que gana la entidad por cada sol consumido con tarjeta o QR (intercambio o comision de comercio)
    margen_anual_sobre_saldo_apartado: 0.03
    porcentaje_de_puntos_que_se_canjea: 0.70
    reinversion_maxima_de_la_comision: 0.30   # el programa no devuelve mas del 30 % de lo que la entidad gana por el consumo
    canales_que_pagan_comision: [tarjeta_debito, tarjeta_credito, pago_qr]
  # Puntos por cada S/ 10 consumidos. Solo para quien pasa la idoneidad de consumo: no se incentiva gastar a quien tiene la caja en tension.
  # Cada tasa respeta el tope de reinversion: tasa x valor del punto / 10 <= reinversion_maxima x comision.
  puntos_por_cada_10_soles_de_consumo: {luchador: 0.0, aprendiz: 0.5, constructor: 1.0, maestro: 2.0, campeon: 3.0}
  # Puntos por cada S/ 100 que se aparta en el mes. Mas para quien mas lo necesita: el ahorro deja margen y baja el riesgo de mora.
  puntos_por_cada_100_soles_apartados: {luchador: 8, aprendiz: 6, constructor: 5, maestro: 4, campeon: 3}
  idoneidad_de_consumo: {dias_rojo_3m_max: 0, nivel_minimo: aprendiz}
  # Ingresos a futuro: escenarios a varios anios. TODO esto es supuesto del equipo (no hay cifra publica ni piloto): sirve para ver CUANDO se paga el programa y que debe
  # cumplirse para que se pague, no para prometer un resultado. Un piloto con grupo de control reemplaza estos valores. Cada escenario suma lo medido (el colchon adicional de Lucas)
  # mas el efecto de conducta que se le atribuye al programa: mas consumo con tarjeta o QR, mas ahorro apartado (el saldo se acumula de un anio a otro) y menos abandono.
  proyeccion_a_futuro:
    anos: 5
    abandono_anual_base: 0.20              # supuesto: de cada 100 usuarios activos, 20 dejan de usar la app cada anio
    retiro_anual_de_lo_apartado: 0.30      # supuesto: del saldo apartado se retira cada anio este porcentaje
    escenarios:
      solo_lo_medido:  {consumo_mas: 0.00, ahorro_mas: 0.00, abandono_menos: 0.00}   # ningun efecto de conducta: solo el colchon adicional que Lucas ya mostro en la simulacion
      prudente:        {consumo_mas: 0.02, ahorro_mas: 0.05, abandono_menos: 0.05}
      base:            {consumo_mas: 0.05, ahorro_mas: 0.10, abandono_menos: 0.10}
      optimista:       {consumo_mas: 0.10, ahorro_mas: 0.20, abandono_menos: 0.20}
  beneficios_por_nivel:
    luchador: ["Puntos extra por ahorrar y por cerrar quincenas sin rojo", "Plan Sueldo Lucas", "Aviso anticipado antes de un dia en rojo"]
    aprendiz: ["Puntos por consumo en bodegas, transporte y salud afiliados", "Puntos por ahorrar", "Metas de ahorro con aporte automatico"]
    constructor: ["Mas puntos por consumo con tarjeta o QR", "Simulador de escenarios", "Comparador educativo de tasas"]
    maestro: ["Puntos dobles por consumo con tarjeta o QR", "Prioridad en ofertas idoneas", "Revision trimestral de gastos fijos"]
    campeon: ["Maximo de puntos por consumo", "Acceso prioritario a las mejores condiciones idoneas", "Canje de beneficios exclusivos"]

canje:
  - {id: descuento_mantenimiento, nombre: "Descuento en la comision de mantenimiento de cuenta", puntos: 500, tipo: generico}
  - {id: tasa_preferencial_vivienda, nombre: "Prioridad para una tasa preferencial en mejoras de vivienda con prevencion ante lluvias", puntos: 800, tipo: generico, requiere_idoneidad: true}
  - {id: asesoria_educativa, nombre: "Sesion de educacion financiera con un especialista", puntos: 300, tipo: generico}
  - {id: sorteo_apartado, nombre: "Participacion en un sorteo de un aporte a tu meta de ahorro", puntos: 200, tipo: generico}

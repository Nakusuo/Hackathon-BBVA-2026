# Niveles de Lucas por segmento del cliente y programa de puntos.
# El nombre sale del ranking de salud financiera de cada segmento (no del numero de cluster), asi que no cambia si se reentrena el modelo.
# Los puntos premian conductas financieras sanas, nunca gastar mas ni endeudarse. Todo el catalogo es ficticio y generico (sin marcas).
version: 1
escalera: [luchador, aprendiz, constructor, maestro, campeon]   # con k segmentos se eligen k nombres repartidos en la escalera
niveles:
  luchador:
    titulo: "Luchador"
    resumen: "Tu caja se aprieta antes de cobrar. Vamos paso a paso y sin presion."
    tono: "cercano y tranquilo; una sola accion a la vez"
    multiplicador_puntos: 1.5
    beneficios: ["Aviso anticipado cuando se acerca un dia en rojo", "Plan Sueldo Lucas para ordenar un ingreso irregular", "Puntos extra por cada primer logro"]
    para_subir: {salud_minima: 40, dias_rojo_3m_max: 3}
  aprendiz:
    titulo: "Aprendiz"
    resumen: "Estas armando tus habitos. Ya no te ahoga la caja, ahora toca ganar margen."
    tono: "motivador; explica el porque de cada consejo"
    multiplicador_puntos: 1.3
    beneficios: ["Metas de ahorro con aporte por quincena", "Rutas de educacion financiera segun tu perfil", "Puntos extra por cumplir metas"]
    para_subir: {salud_minima: 55, colchon_meses_min: 1.0}
  constructor:
    titulo: "Constructor"
    resumen: "Tienes base. Estas construyendo colchon y orden."
    tono: "practico; propone metas medibles"
    multiplicador_puntos: 1.2
    beneficios: ["Simulador de escenarios", "Comparador educativo de tasas"]
    para_subir: {salud_minima: 65, colchon_meses_min: 2.0}
  maestro:
    titulo: "Maestro"
    resumen: "Manejas bien tu plata. Se trata de afinar y de protegerte de imprevistos."
    tono: "directo; da opciones y deja decidir"
    multiplicador_puntos: 1.1
    beneficios: ["Prioridad en ofertas idoneas de ahorro", "Revision trimestral de tus gastos fijos", "Descuentos del catalogo de canje"]
    para_subir: {salud_minima: 75, ahorro_pct_min: 0.10, colchon_meses_min: 3.0}
  campeon:
    titulo: "Campeon"
    resumen: "Vas adelante: colchon, ahorro y orden. Ahora cuidamos lo que lograste."
    tono: "reconoce el logro; propone proteger y hacer crecer con prudencia"
    multiplicador_puntos: 1.0
    beneficios: ["Acceso prioritario a las mejores condiciones idoneas del catalogo", "Beneficios exclusivos del catalogo de canje", "Invitacion a ser guia de otros usuarios"]
    para_subir: {}

puntos:
  # Puntos base por conducta. Se multiplican por el multiplicador del nivel: quien parte de mas lejos gana mas por cada logro.
  acciones:
    quincena_sin_dias_en_rojo: 50
    aporte_a_meta_de_ahorro: 100
    cancelar_suscripcion_duplicada: 30
    modulo_educativo_completado: 20
    colchon_de_un_mes_mantenido: 60
    accion_de_prevencion_ante_el_nino: 80
    subir_de_nivel: 300
  valor_por_punto_soles: 0.01      # supuesto del equipo para la calculadora del banco; el banco pone el suyo
  tope_mensual: 600

canje:
  - {id: descuento_mantenimiento, nombre: "Descuento en la comision de mantenimiento de cuenta", puntos: 500, tipo: generico}
  - {id: tasa_preferencial_vivienda, nombre: "Prioridad para una tasa preferencial en mejoras de vivienda con prevencion ante lluvias", puntos: 800, tipo: generico, requiere_idoneidad: true}
  - {id: asesoria_educativa, nombre: "Sesion de educacion financiera con un especialista", puntos: 300, tipo: generico}
  - {id: sorteo_apartado, nombre: "Participacion en un sorteo de un aporte a tu meta de ahorro", puntos: 200, tipo: generico}
